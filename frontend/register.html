<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoTrack — Create Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-text">🌿 Eco<span>Track</span></div>
      <div class="auth-logo-sub">Join thousands reducing their carbon footprint.</div>
    </div>

    <div id="alert-box"></div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Rahul Sharma" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label">Reduction Target (%)</label>
        <input type="number" id="targetReduction" class="form-control" placeholder="20" value="20" min="5" max="100">
        <div class="form-text">How much do you want to reduce your carbon footprint this year?</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">
        🌱 Create Account
      </button>
    </form>

    <div class="auth-divider">Already have an account?</div>
    <a href="login.html" class="btn btn-outline btn-block">Sign in</a>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  redirectIfAuth();

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    const alertBox = document.getElementById('alert-box');

    btn.innerHTML = '<span class="spinner"></span> Creating account...';
    btn.disabled = true;
    alertBox.innerHTML = '';

    try {
      const data = await api.post('/auth/register', {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        targetReduction: parseInt(document.getElementById('targetReduction').value)
      });

      Auth.setToken(data.token);
      Auth.setUser(data.user);
      showToast('Welcome to EcoTrack! 🌱', 'success');
      window.location.href = 'dashboard.html';
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger">❌ ${err.message}</div>`;
      btn.innerHTML = '🌱 Create Account';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
