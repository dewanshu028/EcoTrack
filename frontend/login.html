<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoTrack — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-text">🌿 Eco<span>Track</span></div>
      <div class="auth-logo-sub">Track your carbon footprint. Protect the planet.</div>
    </div>

    <div id="alert-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
        Sign In
      </button>
    </form>

    <div class="auth-divider">Don't have an account?</div>
    <a href="register.html" class="btn btn-outline btn-block">Create free account</a>

    <p class="text-center text-muted mt-2" style="font-size:0.8rem;">
      By signing in, you contribute to a greener planet 🌍
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  redirectIfAuth();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const alertBox = document.getElementById('alert-box');
    
    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    btn.disabled = true;
    alertBox.innerHTML = '';

    try {
      const data = await api.post('/auth/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      Auth.setToken(data.token);
      Auth.setUser(data.user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger">❌ ${err.message}</div>`;
      btn.innerHTML = 'Sign In';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
